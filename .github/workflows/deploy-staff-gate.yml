name: Deploy staff gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 apply_gate.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add index.html
          git commit -m "Deploy staff role gate" || exit 0
          git push

name: Activate keyboard role input
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp role-code-gate-v2.js role-code-gate.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add role-code-gate.js
          git commit -m "Fix mobile keyboard on opening role input" || exit 0
          git push

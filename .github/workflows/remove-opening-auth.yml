name: Remove opening authentication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-opening-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove opening auth block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          pattern = r'<div id="authGate"[^>]*>.*?</div></div>\s*(?=<div id="startupOverlay")'
          new, count = re.subn(pattern, "", s, count=1, flags=re.S)

          if count != 1:
              raise SystemExit("Opening authentication block was not found exactly once.")

          p.write_text(new, encoding="utf-8")
          print("Opening authentication block removed.")
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove opening authentication process"
          git push origin main

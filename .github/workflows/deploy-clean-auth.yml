name: Deploy clean staff authentication
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace('<div id="authGate" aria-hidden="false">','<div id="authGate" aria-hidden="false" style="display:none">',1)
          if 'staff-auth-screen.js' not in s:
              s=s.replace('</body>','<script src="./staff-auth-screen.js"></script>\n</body>',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Deploy clean two-field staff authentication" || exit 0
          git push

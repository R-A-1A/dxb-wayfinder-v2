name: Apply DXB access gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          if git log -1 --pretty=%B | grep -q '\\[access-gate-applied\\]'; then exit 0; fi
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'<div id="authGate" aria-hidden="false">.*?</div>\s*</div>\s*<div id="startupOverlay"',s,re.S)
          if not old:
              raise SystemExit('auth gate not found')
          gate='''<div id="authGate" aria-hidden="false">
          <div class="auth-card staff-auth-card">
          <div class="auth-brand">Dubai International Airport</div>
          <div class="auth-title">DXB Staff Wayfinder</div>
          <div class="auth-sub">Select your staff role and enter the site access code.</div>
          <div class="staff-role-grid" role="group" aria-label="Staff role">
          <button type="button" class="staff-role-btn active" data-role="GXA">GXA</button>
          <button type="button" class="staff-role-btn" data-role="STL">STL</button>
          <button type="button" class="staff-role-btn" data-role="TL">TL</button>
          </div>
          <label class="staff-auth-label">Access code<input id="staffAccessCode" type="password" inputmode="numeric" placeholder="DXB2026"></label>
          <select id="staffRole" aria-label="Selected staff role" hidden><option>GXA</option><option>STL</option><option>TL</option></select>
          <div id="staffLocationStatus" class="auth-location-status" role="status"></div>
          <div id="staffAuthError" class="auth-error" role="alert"></div>
          <div id="staffAuthAttempts" class="auth-attempts"></div>
          <button id="staffAuthSubmit" class="auth-submit" type="button">Enter Wayfinder</button>
          <button id="managementLoginOption" class="auth-management" type="button">Owner / Admin login</button>
          <div class="auth-foot">Staff access uses the site code. Management accounts are handled separately.</div>
          </div></div>
          <div id="startupOverlay"'''
          s=s[:old.start()]+gate+s[old.end():]
          css='''\n/* v10 role/code staff access */\n.staff-role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.staff-role-btn{min-height:46px;border:1px solid #dce1ee;border-radius:12px;background:#fff;color:#132b71;font-weight:900}.staff-role-btn.active{background:#132b71;color:#ffdf01;border-color:#132b71}.staff-auth-label{display:block;font-size:12px;font-weight:800;color:#344054}.staff-auth-label input{display:block;width:100%;margin-top:6px;border:1px solid #dce1ee;border-radius:11px;padding:12px;background:#fff;color:var(--ink)}.auth-location-status{display:none;margin-top:10px;padding:9px;border-radius:10px;background:#f5f7fb;border:1px solid #dce1ee;font-size:11px}.auth-location-status.show{display:block}.auth-attempts{min-height:15px;margin-top:7px;text-align:center;color:#98a2b3;font-size:10px}.auth-management{width:100%;min-height:42px;margin-top:8px;border:1px solid #dce1ee;border-radius:11px;background:#fff;color:#132b71;font-weight:800}\n'''
          if '/* v10 role/code staff access */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          mod=re.compile(r'<script type="module">\s*import \{ initializeApp \} from "https://www\.gstatic\.com/firebasejs/12\.9\.0/firebase-app\.js";.*?</script>',re.S)
          replacement='''<script type="module">
          import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
          import { getAuth } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
          const firebaseConfig={authDomain:"dxb-staff-wayfinder.firebaseapp.com",projectId:"dxb-staff-wayfinder",storageBucket:"dxb-staff-wayfinder.firebasestorage.app",messagingSenderId:"975115625194",appId:"1:975115625194:web:bd1a0f1c2a1522555c2d93"};
          window.dxbFirebaseAuth=getAuth(initializeApp(firebaseConfig));
          </script><script src="./access-control.js"></script>'''
          s,n=mod.subn(replacement,s,count=1)
          if n!=1: raise SystemExit('firebase module not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Implement role code access gate [access-gate-applied]"
          git push
